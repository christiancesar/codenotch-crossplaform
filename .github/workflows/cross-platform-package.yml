name: Cross-platform package (preview)

# Builds installers on every push so they're downloadable from the workflow run itself
# (Actions artifacts, needs a GitHub login, expire after 90 days) without waiting for a
# real tagged release on main. See release-publish.yml for the actual public release.
on:
  push:
    branches: [cross-platform-port, development]
    paths: ["cross-platform/**", ".github/workflows/cross-platform-package.yml"]
  workflow_dispatch: {}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross-platform

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: cargo tauri build --bundles deb,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: cargo tauri build

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: codenotch-linux
          path: |
            cross-platform/target/release/bundle/deb/*.deb
            cross-platform/target/release/bundle/appimage/*.AppImage

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows
          path: |
            cross-platform/target/release/bundle/nsis/*.exe
            cross-platform/target/release/bundle/msi/*.msi
