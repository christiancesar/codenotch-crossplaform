name: Package (preview)

# Builds the installers of the app in crossplatform-v2/ on every push to development, so they are
# downloadable from the workflow run itself (Actions artifacts, need a GitHub login, expire after
# 90 days) without waiting for a tagged release. See release-publish.yml for the public release.
on:
  push:
    branches: [development]
    paths: ["crossplatform-v2/**", ".github/workflows/cross-platform-package.yml"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crossplatform-v2
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri build deps
        if: runner.os == 'Linux'
        # Plain apt with a fresh index: a cached package list went stale and 404'd, which left
        # the GTK headers out and failed glib-sys at build time
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crossplatform-v2/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform-v2/src-tauri
          key: release

      - run: npm ci

      # `tauri build` runs beforeBuildCommand (npm run build) itself
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: codenotch-linux
          path: |
            crossplatform-v2/src-tauri/target/release/bundle/deb/*.deb
            crossplatform-v2/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows
          path: |
            crossplatform-v2/src-tauri/target/release/bundle/nsis/*.exe
            crossplatform-v2/src-tauri/target/release/bundle/msi/*.msi
