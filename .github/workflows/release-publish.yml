name: Release (Windows + Linux)

# Follows the project's GitFlow: `release` stabilizes a version, merges into `main`
# (production) AND back into `development`, then a `v*` tag pushed on `main` is what
# actually cuts a public GitHub Release, never a raw push to `release` itself. This
# builds crossplatform/ for both
# OSes and publishes the installers as a draft release for review before anyone can
# download them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri build deps
        if: runner.os == 'Linux'
        # Plain apt with a fresh index: a cached package list went stale and 404'd, which left
        # the GTK headers out and failed glib-sys at build time
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crossplatform/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform/src-tauri
          key: release

      # tauri-action runs `tauri build`, which runs beforeBuildCommand (npm run build); that
      # needs the frontend's dependencies installed first
      - name: Install frontend dependencies
        working-directory: crossplatform
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crossplatform
          # tauri-action does not derive the tag from the triggering push event: without this
          # it silently skips all uploads ("No releaseId or tagName provided"), which is what
          # happened on the first v0.3.0 attempt.
          tagName: ${{ github.ref_name }}
          # Linux gets deb + AppImage explicitly; Windows uses tauri.conf.json's
          # bundle.targets: "all" default (nsis + msi), no args needed.
          args: ${{ runner.os == 'Linux' && '--bundles deb,appimage' || '' }}
          releaseName: "Codenotch ${{ github.ref_name }}"
          releaseBody: |
            Codenotch 0.4.1 makes sessions and Claude usage work on Windows:
            - The Claude Code hooks are wired at start and removed by the uninstaller; the
              Settings switch-off is remembered.
            - A desktop-app session that finishes while you are in Claude stays "done".
            - The Claude token is renewed with the standalone `claude` CLI before it expires,
              and an expired one is never sent (it read as an hour-long rate limit).
            - The idle notch folds to a tab on any OS (Settings > Notch > Position to turn it off).
            - The notch can sit on the top, left, right or bottom edge (Settings or the tray menu).
            - Double-clicking the tray icon opens Settings.
            The v0.3 reference app is gone from the repository (tag archive/v0.3-reference).
          releaseDraft: true
          prerelease: false
