[package]
name = "codenotch"
version = "0.4.0"
description = "Usage notch for Claude, Codex, Cursor, Antigravity and OpenCode"
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the `codenotch` binary (cargo#8519 on Windows)
name = "codenotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release candidates: pinned with `=` so an rc bump never changes the generated bindings unasked
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
